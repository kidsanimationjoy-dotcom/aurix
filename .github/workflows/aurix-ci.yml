name: AURIX CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'companion/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/aurix-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'companion/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/aurix-ci.yml'

permissions:
  contents: read

concurrency:
  group: aurix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm application source is present
        run: |
          if [ ! -f package.json ]; then
            echo "::error::AURIX application source is not in the repository root yet. Add the contents of the reviewed aurix project folder, then rerun this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/aurix-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          node --input-type=module -e "
            const url = 'http://127.0.0.1:4173';
            let ready = false;
            for (let i = 0; i < 60; i++) {
              try {
                const response = await fetch(url);
                if (response.ok) { ready = true; break; }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!ready) {
              console.error('Preview server did not become ready.');
              process.exit(1);
            }
          "
          AURIX_URL=http://127.0.0.1:4173 npm run smoke
