name: AURIX CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'aurix-phase-0-1-reviewed.zip'
      - 'aurix-phase-0-1.zip'
      - 'src/**'
      - 'tests/**'
      - 'companion/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/aurix-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'companion/**'
      - 'scripts/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/aurix-ci.yml'

permissions:
  contents: read

concurrency:
  group: aurix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether application source is present
        id: source
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            ARCHIVE=""
            if [ -f aurix-phase-0-1-reviewed.zip ]; then ARCHIVE="aurix-phase-0-1-reviewed.zip"; fi
            if [ -z "$ARCHIVE" ] && [ -f aurix-phase-0-1.zip ]; then ARCHIVE="aurix-phase-0-1.zip"; fi
            if [ -n "$ARCHIVE" ]; then
              echo "Found $ARCHIVE; extracting application source."
              unzip -q "$ARCHIVE"
              if [ -f aurix/package.json ]; then cp -a aurix/. .; fi
            fi
          fi
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI is configured. Upload aurix-phase-0-1-reviewed.zip or aurix-phase-0-1.zip to the repository root to enable the full build and test suite."
          fi

      - name: Install dependencies
        if: steps.source.outputs.present == 'true'
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        if: steps.source.outputs.present == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.source.outputs.present == 'true'
        run: npm test

      - name: Production build
        if: steps.source.outputs.present == 'true'
        run: npm run build

      - name: Install Chromium for browser smoke tests
        if: steps.source.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: steps.source.outputs.present == 'true'
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/aurix-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          node --input-type=module -e "
            const url = 'http://127.0.0.1:4173';
            let ready = false;
            for (let i = 0; i < 60; i++) {
              try {
                const response = await fetch(url);
                if (response.ok) { ready = true; break; }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!ready) {
              console.error('Preview server did not become ready.');
              process.exit(1);
            }
          "
          AURIX_URL=http://127.0.0.1:4173 npm run smoke
